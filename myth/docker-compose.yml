# The app on :8080. AI answers come from the free cloud provider chosen in
# Settings → AI brain (LLM7 by default — no account, no key).
#   docker compose up -d --build

services:
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        VITE_APP_NAME: "Myth"
        VITE_APP_PASSWORD: "${APP_PASSWORD:-mukilx}"
        VITE_AI_ENDPOINT: "${AI_ENDPOINT:-https://api.llm7.io/v1}"
        VITE_AI_MODEL: "${AI_MODEL:-}"
    container_name: myth
    ports:
      - "8080:80"
    restart: unless-stopped
