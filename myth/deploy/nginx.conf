server {
  listen       80;
  server_name  _;
  root         /usr/share/nginx/html;
  index        index.html;

  # Compress text assets on the fly.
  gzip              on;
  gzip_vary         on;
  gzip_min_length   1024;
  gzip_types        text/plain text/css application/javascript application/json
                    image/svg+xml application/manifest+json;

  # Hashed build assets never change — cache them hard.
  location /assets/ {
    expires    1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # Images and icons: cache, but allow revalidation so a re-upload is picked up.
  location ~* \.(png|jpe?g|svg|webp|ico|woff2?)$ {
    expires    30d;
    add_header Cache-Control "public";
    access_log off;
  }

  # index.html must never be cached, or clients pin an old bundle forever.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # Single-page app: every unknown path renders the app shell.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Baseline hardening. No CSP here because the app must be free to reach
  # whatever AI endpoint the user configures (localhost or otherwise).
  add_header X-Content-Type-Options "nosniff"        always;
  add_header X-Frame-Options        "SAMEORIGIN"     always;
  add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
